name: Build APK

on:
  push:
    paths: ['android/**', 'lists/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Rename with date
        id: apk
        run: |
          D=$(date +%Y%m%d)
          cp android/app/build/outputs/apk/debug/app-debug.apk "myadblock_${D}.apk"
          echo "name=myadblock_${D}.apk" >> "$GITHUB_OUTPUT"
          echo "tag=apk-${D}-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.apk.outputs.tag }}" "${{ steps.apk.outputs.name }}" \
            --title "${{ steps.apk.outputs.name }}" --notes "My AdBlock debug APK" \
            --prerelease --target "${{ github.sha }}"
